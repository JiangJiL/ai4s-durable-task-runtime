# 临时集成测试 profile：只连接 docker-compose.it.yml 的隔离 MySQL，不指向开发库。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/ai4s_durable_runtime_it?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    # 空密码只适用于 docker-compose.it.yml；生产环境必须由 RUNTIME_DB_PASSWORD 注入。
    password: ${RUNTIME_DB_PASSWORD:}

runtime:
  outbox:
    fixed-delay: PT1S
  reconciliation:
    fixed-delay: PT1S
  retry:
    fixed-delay: PT1S
